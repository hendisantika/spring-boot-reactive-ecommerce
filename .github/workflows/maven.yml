# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 25
      uses: actions/setup-java@v6.1.0
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    # Runs unit tests (surefire) and integration tests (failsafe); Testcontainers uses the runner's Docker daemon
    - name: Build and test with Maven
      run: ./mvnw -B -ntp verify

    - name: Upload test reports
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: test-reports
        path: |
          target/surefire-reports/
          target/failsafe-reports/

  # Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
  dependency-submission:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 25
      uses: actions/setup-java@v6.1.0
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c
