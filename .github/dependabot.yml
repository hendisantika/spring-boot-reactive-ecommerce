version: 2
updates:
  # Maven dependencies (pom.xml)
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - java
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
      include: scope
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot*"
      testcontainers:
        patterns:
          - "org.testcontainers*"
      maven-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Spring Boot major upgrades need a manual migration
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: [ "version-update:semver-major" ]

  # GitHub Actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Asia/Jakarta
    labels:
      - dependencies
      - github_actions
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns:
          - "*"

  # Docker images in docker-compose.yml
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Asia/Jakarta
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "chore(deps)"

  # Testcontainers images, read by TestcontainersConfiguration from these Dockerfiles
  - package-ecosystem: docker
    directory: "/src/test/resources/testcontainers"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Asia/Jakarta
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "test(deps)"
    groups:
      testcontainers-images:
        patterns:
          - "*"
